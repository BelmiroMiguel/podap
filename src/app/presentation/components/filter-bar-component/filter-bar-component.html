<div class="mx-4 md:mx-8 mt-10 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">

  <!-- Grupo de Filtros de Status -->
  <div class="flex bg-gray-100 p-1 rounded-full border border-gray-200 shadow-sm">
    <!-- Botão: TODOS -->
    <p-button label="Todos" (onClick)="selecionarFiltro('TODOS')" [text]="filtroTipo !== 'TODOS'"
      [severity]="filtroTipo === 'TODOS' ? 'primary' : 'secondary'"
      styleClass="!px-8 !py-2.5 !font-bold !rounded-full !border-none {{ filtroTipo !== 'TODOS' ? '!text-slate-600 !font-medium hover:!bg-gray-200' : '' }}"
      [style]="filtroTipo === 'TODOS' ? {'background-color': 'var(--p-primary-500)', 'color': 'var(--p-primary-contrast-color)'} : {}">
    </p-button>

    <!-- Botão: PERDIDOS -->
    <p-button label="Perdidos" (onClick)="selecionarFiltro('PERDIDO')" [text]="filtroTipo !== 'PERDIDO'"
      [severity]="filtroTipo === 'PERDIDO' ? 'primary' : 'secondary'"
      styleClass="!px-8 !py-2.5 !font-bold !rounded-full !border-none {{ filtroTipo !== 'PERDIDO' ? '!text-slate-600 !font-medium hover:!bg-gray-200' : '' }}"
      [style]="filtroTipo === 'PERDIDO' ? {'background-color': 'var(--p-primary-500)', 'color': 'var(--p-primary-contrast-color)'} : {}">
    </p-button>

    <!-- Botão: ACHADOS -->
    <p-button label="Achados" (onClick)="selecionarFiltro('ACHADO')" [text]="filtroTipo !== 'ACHADO'"
      [severity]="filtroTipo === 'ACHADO' ? 'primary' : 'secondary'"
      styleClass="!px-8 !py-2.5 !font-bold !rounded-full !border-none {{ filtroTipo !== 'ACHADO' ? '!text-slate-600 !font-medium hover:!bg-gray-200' : '' }}"
      [style]="filtroTipo === 'ACHADO' ? {'background-color': 'var(--p-primary-500)', 'color': 'var(--p-primary-contrast-color)'} : {}">
    </p-button>
  </div>


  <!-- Contador de Resultados -->
  <div class="flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 rounded-full shadow-sm">
    <i class="pi pi-th-large text-gray-400 text-sm"></i>
    @if(qtdResultado>0){
    <span class="text-sm font-bold text-slate-700">
      {{qtdResultado>75 ? '+': ''}}{{qtdResultado}}
      resultado{{qtdResultado>1 ? 's': ''}}
    </span>
    }@else {
    <span class="text-sm font-bold text-slate-700">
      Sem resultados
    </span>}
  </div>

</div>
