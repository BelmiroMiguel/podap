<p-card styleClass="!rounded-[2.5rem] overflow-hidden !shadow-sm !border-none !p-0">
  <ng-template pTemplate="header">
    <!-- Skeleton da Imagem -->
    <div class="h-50 w-full">
      <p-skeleton width="100%" height="100%" />
    </div>
  </ng-template>

  <div class="flex flex-col p-3">
    <!-- Skeleton da Categoria -->
    <p-skeleton width="30%" height="0.75rem" styleClass="mb-3" />

    <!-- Skeleton do Título -->
    <p-skeleton width="70%" height="1.5rem" styleClass="mb-4" />

    <!-- Skeleton da Descrição (Linhas) -->
    <div class="space-y-2 mb-2">
      <p-skeleton width="100%" height="0.875rem" />
      <p-skeleton width="90%" height="0.875rem" />
    </div>

    <!-- Skeleton do Rodapé -->
    <div class="flex items-center justify-between mt-2 pt-5 border-t border-slate-100">
      <div class="flex items-center gap-2">
        <!-- Círculo para o ícone de localização -->
        <p-skeleton shape="circle" size="1.2rem" />
        <p-skeleton width="80px" height="0.75rem" />
      </div>
      <p-skeleton width="60px" height="0.75rem" />
    </div>
  </div>
</p-card>
